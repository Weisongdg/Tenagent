[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenagent"
version = "0.1.0"
description = "A small LangChain chat agent with persistent sessions"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "python-dotenv>=1,<2",
    "openpyxl>=3.1,<4",
    "pydantic>=2.7,<3",
    "jinja2>=3.1,<4",
    "sqlmodel>=0.0.48,<0.1",
    "langchain-chroma>=1.1,<2",
    "chromadb>=1.5.9,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools]
py-modules = ["app", "config", "tools"]

[tool.setuptools.packages.find]
include = ["feature*"]

[tool.setuptools.package-data]
"feature.issue_analysis" = ["templates/*.j2"]
"feature.issue_qa" = ["templates/*.j2"]
"feature.issue_report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
